name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.1
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: python eval/validate_dataset.py
      - run: python -c 'from pathlib import Path; from eval.validate_dataset import validate_dataset; print(validate_dataset(Path("eval/heldout_questions.jsonl")))'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
